aid: sarus
name: Sarus
description: 'Sarus Technologies is a Paris-based privacy-engineering company (Y Combinator W22,
  founded 2020 by the team behind AlephD) that builds a privacy layer sitting between sensitive data
  and the analysts, data scientists and LLMs that need it. The Sarus platform deploys inside the
  customer''s own infrastructure — Docker or Kubernetes, on-premises or on AWS, Azure and GCP — and
  applies differential privacy, DP-trained synthetic data and on-the-fly SQL and Python query
  rewriting so practitioners can run analytics, machine learning and LLM fine-tuning on data they
  never see. Developers reach the platform through the first-party ''sarus'' Python client for the
  Sarus Gateway, a BI connector, and Qrlew, Sarus''s open-source Rust SQL-rewriting engine. Because
  the product is customer-deployed, Sarus publishes no hosted, multi-tenant API base URL and no
  OpenAPI; its public machine-readable surface is the Sarus Data Spec protobuf schema and the Qrlew
  server''s published request examples.'
