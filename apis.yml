apis:
- aid: sarus:sarus-gateway
  name: Sarus Gateway API
  description: 'The Sarus Gateway is the server component of the Sarus privacy layer. It is deployed
    inside the customer''s own environment (Docker or Kubernetes, on-premises or in AWS/Azure/GCP)
    and is reached by the first-party ''sarus'' Python client, a BI connector, and SQL. Because every
    deployment is customer-hosted there is no shared production base URL; the host is a deployment
    variable. The reference at docs.sarus.tech is no longer publicly readable (GitLab Pages access
    control returns 401), so no OpenAPI or public endpoint reference could be captured.'
  humanURL: https://docs.sarus.tech/
  baseURL: https://{sarus-gateway-host}/
  tags:
  - Privacy
