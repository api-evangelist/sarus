- aid: sarus:qrlew-server
  name: Qrlew Server API
  description: 'Qrlew is Sarus''s open-source (Apache 2.0) SQL manipulation and differential-privacy
    engine, written in Rust and published under github.com/Qrlew. The Qrlew server wraps it in a small
    RESTful API — POST /dot, /rewrite_as_privacy_unit_preserving, /rewrite_with_differential_privacy,
    /verify and GET /public_key — distributed as the container image ghcr.io/qrlew/server:main and run
    by the operator. The demo host the README names (qrlew.sarus.app) no longer resolves to a live
    service, so this is a self-hosted surface only.'
  humanURL: https://github.com/Qrlew/server
  baseURL: https://{qrlew-server-host}/
