name: Sarus client libraries and packages
provider: Sarus Technologies
note: >-
  Sarus ships no JavaScript/TypeScript, Java, .NET, Go, Ruby or PHP client. Its entire published
  client surface is Python plus the Rust Qrlew engine. Ownership of the Qrlew packages is confirmed
  first-party: the github.com/Qrlew organisation profile states "Qrlew is Sarus open source SQL
  manipulation engine and differential privacy impl", the crates.io description is "Sarus Qrlew
  Engine", and Sarus published both the announcement post and the arXiv paper (2401.06273) under
  its own name. CURRENCY FINDING — every first-party package below last published in 2024
  (latest: pyqrlew and qrlew on 2024-12-12). Nothing has shipped in ~20 months as of this pass,
  while the company continues to publish product blog posts, which is a divergence worth noting
  for any integrator evaluating the SDK.
