surfaces:
- api: sarus:sarus-gateway
  base: https://{sarus-gateway-host}/gateway
  style: JSON over HTTP, called through the 'sarus' Python client
  resources_seen_in_client:
  - POST /login
  - GET /oidc_login?headless=true
  - GET /datasets
