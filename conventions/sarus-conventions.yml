authentication:
  style: session cookie (email/password POST /login, or Google OIDC)
  profile: authentication/sarus-authentication.yml
idempotency:
  coverage: none
  header: null
  note: >-
    No idempotency key or replay protection appears in the client or the Qrlew examples. The Qrlew
    server's POST operations are pure transformations of the request body (no stored state), so
    repeating one has no side effect, but that is a property of the operation, not a mechanism.
pagination:
  style: none observed
  note: List calls (GET /datasets, GET /dataconnections) return a full JSON array.
async_tasks:
  note: >-
    Long-running work is modelled as tasks — POST /dataspecs/{uuid}/launch, then poll
    GET /dataspecs/{uuid}/status and fetch GET /dataspecs/{uuid}/result; training runs are polled
    at GET /training_tasks/{id}.
request_tracing:
  header: null
  client_version_header: SARUS-Client-SDK-Version
versioning:
  style: none in the URL or headers; client version advertised in SARUS-Client-SDK-Version
errors:
  envelope: JSON object with a "message" field on 4xx
  note: >-
    The client raises "Server - <message>" for 4xx bodies carrying message, and raw HTTP errors for
    5xx. 401 on /login means incorrect credentials. No RFC 9457 problem+json.
rate_limit_signaling:
  headers: []
  note: none documented or handled by the client
reversibility:
  grade: none
  write_surfaces:
  - surface: training tasks
    reversal: DELETE /training_tasks/{id}/abort (client method _abort_training; expects 204)
    window: null
    docs: null
    note: >-
      Observed in client code only — an abort of a running task, not an undo of its effects. No
